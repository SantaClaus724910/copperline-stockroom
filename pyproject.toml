[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "copperline-stockroom"
version = "0.1.0"
description = "Local parts inventory and movement ledger for small electronics workshops"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = []

[project.scripts]
copperline = "copperline.cli:entrypoint"

[tool.setuptools.packages.find]
include = ["copperline*"]
